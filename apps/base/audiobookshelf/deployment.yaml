#              mountPath: /podcasts
#            - name: config
#              mountPath: /config
#            - name: metadata
#              mountPath: /metadata
      volumes:
        - name: audiobookshelf-data
          persistentVolumeClaim:
            claimName: audiobookshelf-data-pvc
