apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
#      securityContext:
#        fsGroup: 33 # www-data group ID. 
#        runAsUser: 33 # www-data group ID
#        runAsGroup: 33 # www-data group ID
  # look at docker files to documentation on the users
  # look for users/profiles to secure in the dockerfile
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:latest
          ports:
            - containerPort: 3005

#          securityContxt:        #  <------
#            allowPrivilegeEscalation: false   #  <----


          envFrom:
            - configMapRef:
                name: audiobookshelf-configmap


#           - secretRef:
#               name: linkding-signin
# 
          volumeMounts:
            - name: audiobookshelf-data
              mountPath: /data
