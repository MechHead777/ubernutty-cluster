apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        fsGroup: 33 # www-data group ID. 
        runAsUser: 33 # www-data group ID
        runAsGroup: 33 # www-data group ID
  # look at docker files to documentation on the users
  # look for users/profiles to secure in the dockerfile
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.46.2
          ports:
            - containerPort: 9090

          securityContxt:        #  <------
            allowPrivilegeEscalation: false   #  <----


          envFrom:
          - secretRef:
              name: linkding-signin

          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data-pvc
